# compose.traefik.yml — overlay to terminate TLS via Traefik
#
# Usage:
#   docker compose -f compose.yml -f examples/compose.traefik.yml up -d
#
# Assumes a Traefik instance is reachable on a docker network named
# `traefik` and already configured with a `websecure` entrypoint and a
# letsencrypt cert resolver.
#
# Rebrand `traefik` network name + `letsencrypt` resolver if your setup
# differs.

services:
  web:
    # Don't bind host ports — Traefik routes via the docker network.
    ports: !reset []
    networks:
      - glpi
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.glpi.rule: Host(`${SNIPEIT_HOST:-glpi.example.com}`)
      traefik.http.routers.glpi.entrypoints: websecure
      traefik.http.routers.glpi.tls: "true"
      traefik.http.routers.glpi.tls.certresolver: letsencrypt
      traefik.http.services.glpi.loadbalancer.server.port: "80"
      # Security headers middleware (optional; tighten per-deployment)
      traefik.http.middlewares.glpi-sec.headers.stsSeconds: "31536000"
      traefik.http.middlewares.glpi-sec.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.glpi-sec.headers.stsPreload: "true"
      traefik.http.middlewares.glpi-sec.headers.contentTypeNosniff: "true"
      # X-XSS-Protection is set to "0" by nginx (modern browsers ignore the
      # filter; CSP supersedes it). browserXssFilter was the legacy Traefik
      # shortcut for X-XSS-Protection: 1 — drop it.
      traefik.http.routers.glpi.middlewares: glpi-sec

networks:
  traefik:
    external: true
