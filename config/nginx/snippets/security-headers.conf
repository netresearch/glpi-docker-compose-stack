# Security headers shared snippet
# ------------------------------------------------------------------
# nginx's `add_header` directive REPLACES (not merges) inherited
# headers as soon as ANY add_header is defined in a child block.
# That means server-level headers silently vanish in `location ~ \.php$`
# or static-asset locations once those blocks add their own headers
# (e.g. Cache-Control). To guarantee headers reach every response,
# this snippet is `include`d in EVERY location block of default.conf.
# ------------------------------------------------------------------

add_header X-Frame-Options          "SAMEORIGIN"                       always;
add_header X-Content-Type-Options   "nosniff"                          always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
# X-XSS-Protection is deprecated/harmful in modern browsers — explicitly
# disabled (0) per OWASP guidance; CSP below is the real defence.
add_header X-XSS-Protection         "0"                                always;

# ------------------------------------------------------------------
# Content-Security-Policy
# ------------------------------------------------------------------
# Baseline tuned for GLPI today:
#   - 'unsafe-inline' on script-src AND style-src is currently REQUIRED
#     because GLPI ships chart bootstrapping, modal logic and form
#     handlers as inline <script> blocks and inline `style="…"` attrs.
#   - 'unsafe-eval' is needed by some GLPI vendor libs (jQuery
#     templating, Chart.js dynamic evaluators).
#   - img-src allows data: (inline avatars, generated barcodes/QR) and
#     blob: (client-side preview of uploaded images before save).
#   - font-src data: covers Bootstrap-icon and inlined webfont fallbacks.
#   - frame-ancestors 'self' matches the X-Frame-Options SAMEORIGIN above.
#
# Hardening roadmap (do NOT enable until upstream GLPI is verified):
#   1. Replace inline <script> with CSP nonces once GLPI emits them,
#      then drop 'unsafe-inline' from script-src.
#   2. Audit jQuery/Chart.js usage and drop 'unsafe-eval'.
#   3. Move inline style="" attributes to classes, drop style 'unsafe-inline'.
#   4. Add a `report-to` / `report-uri` endpoint and switch to
#      Content-Security-Policy-Report-Only during the rollout window.
#
# Header is ENFORCING (not Report-Only) — start strict from day one and
# loosen only with evidence of breakage.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# ------------------------------------------------------------------
# HTTP Strict Transport Security (HSTS)
# ------------------------------------------------------------------
# DISABLED by default — this stack listens on plain HTTP (port 80) and
# is meant to sit behind a TLS-terminating reverse proxy (Traefik,
# Caddy, nginx-proxy, cloud LB, …). Sending HSTS from a plain-HTTP
# origin is harmless but misleading, and enabling it when TLS is NOT
# actually present can lock users out of the site for `max-age` seconds.
#
# Enable in ONE of these places (NOT both — duplicates are ignored
# anyway, but the highest layer should own it):
#   a) Uncomment the line below ONLY if THIS nginx terminates TLS.
#   b) Set the header at your reverse proxy (recommended — see
#      examples/compose.traefik.yml).
#
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
