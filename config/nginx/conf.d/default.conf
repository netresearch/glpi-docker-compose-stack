upstream glpi-app {
  # php-fpm listens on a unix socket inside a shared tmpfs volume — see the
  # compose.yml `fpm-sock` volume. Closes the FastCGI-bypass risk of a TCP
  # listen on the compose-internal network.
  server unix:/run/php-fpm/glpi.sock;
  keepalive 8;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  # GLPI 11 MUST be served from its public/ subdirectory: only public/ is web-
  # reachable, so config/, vendor/, src/ and the files/ tree are unreachable by
  # construction — the single most important GLPI web-hardening rule.
  root /var/www/glpi/public;
  index index.php;

  charset utf-8;

  # Must match php upload_max_filesize/post_max_size (64M in php/conf.d/glpi.ini)
  # — otherwise nginx rejects large document uploads with 413 before PHP runs.
  client_max_body_size 64M;

  # Security headers live in /etc/nginx/snippets/security-headers.conf and are
  # `include`d in EVERY location below: nginx REPLACES (does not merge)
  # add_header per location, so a server-level set would vanish from any
  # location that adds its own header (e.g. the static Cache-Control).

  # In-container health probe — bypasses php-fpm (used by the web healthcheck).
  location = /health {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  # Block dotfiles (but keep ACME's .well-known reachable).
  location ~ /\.(?!well-known) { deny all; }

  # GLPI front controller: route every request through public/index.php,
  # serving real files (css/js/images) directly when they exist.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.php$is_args$args;
  }

  # index.php is the ONLY executable entry point. GLPI 11 front-controllers all
  # dynamic requests through public/index.php; restricting execution to it
  # shrinks the attack surface (no stray script under the docroot can run).
  # This regex is listed before the catch-all `\.php$` deny so it wins.
  location ~ ^/index\.php$ {
    include /etc/nginx/snippets/security-headers.conf;
    fastcgi_pass glpi-app;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_PROXY "";   # mitigate httpoxy (CVE-2016-5385)
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 16k;
    fastcgi_buffers 16 16k;
    fastcgi_keep_conn on;
  }

  # Static assets — served directly off public/, long cache.
  location ~* \.(?:css|js|mjs|gif|jpe?g|png|svg|webp|woff2?|ttf|eot|ico|map)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
}
