#
# Smoke tests for the glpi-docker-compose-stack repo.
#
# Splits into:
#   - image-surface     → delegates buildx --load amd64 +
#                         container-structure-test to the netresearch/.github
#                         reusable smoke-test-container.yml (@main).
#   - compose-up        → stays inline. Boots the full compose stack with
#                         placeholder-substituted .env and probes / for
#                         HTTP 200/302 — glpi-specific bootstrap and
#                         known HTTP route.
#   - init-idempotency  → stays inline. Verifies bin/init.sh is idempotent —
#                         glpi-specific contract (random DB-password
#                         generation must not re-roll on second run).
#   - upstream-tests    → stays inline. Builds the `tester` Dockerfile stage
#                         which runs the upstream GLPI phpunit suite —
#                         glpi-specific target stage.

name: smoke-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      run_upstream_tests:
        description: 'Also run GLPI phpunit suite (slow, ~5-10 min)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-surface:
    uses: netresearch/.github/.github/workflows/smoke-test-container.yml@main
    permissions:
      contents: read
    with:
      image-tag: glpi-php-fpm:test
      target: runtime
      cst-config-path: tests/container-structure-test.yaml
      cache-scope: smoke-test

  compose-up:
    name: stack boots healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build :latest locally (amd64) and load into docker
        # ghcr.io tag may not exist yet (first push to main) or may be
        # behind HEAD. Build from current Dockerfile and tag it
        # `ghcr.io/.../glpi-php-fpm:latest` so compose.yml's
        # `image:` reference resolves to the local one before compose
        # tries to pull from the registry.
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/glpi-php-fpm:latest
          cache-from: type=gha,scope=smoke-test
          cache-to: type=gha,scope=smoke-test,mode=max
          # No build secret: the GLPI image is built FROM the bundled release
          # tarball (vendor/ pre-installed) — there is no composer step that
          # needs authenticated github.com access (cf. build.yml / Dockerfile).
      - name: Bootstrap .env
        run: |
          cp .env.example .env
          # GLPI has no APP_KEY; just seed the DB passwords compose needs.
          sed -i \
            -e 's|^GLPI_DB_PASSWORD=$|GLPI_DB_PASSWORD=ci-pw-not-secret|' \
            -e 's|^DB_ROOT_PASSWORD=$|DB_ROOT_PASSWORD=ci-rootpw-not-secret|' \
            .env
          chmod 0600 .env
      - name: docker compose up -d (uses locally-loaded image + pulls deps)
        # The glpi-php-fpm:latest image is already in local docker store
        # (from the previous buildx --load step), so compose won't re-pull
        # it. The other services (mariadb, valkey, nginx, ofelia, phpbu) are
        # pulled normally — `--pull missing` is the default.
        run: docker compose up -d --wait --wait-timeout 300
      - name: Wait for the GLPI login page (HTTP 200 + "Authentication - GLPI")
        run: |
          # Resolve the published host port from .env (.env.example pins 8080).
          port="$(grep -E '^GLPI_HTTP_PORT=' .env | cut -d= -f2)"
          port="${port:-8080}"
          body="$(mktemp)"
          for i in $(seq 1 40); do
            # Follow `/` → login redirect; capture body + final status code.
            code=$(curl -sS -L -o "$body" -w '%{http_code}' "http://localhost:${port}/" || true)
            # A bare 200 is not proof on its own (nginx could be serving an
            # error/placeholder page) — assert GLPI's own login-page <title>.
            if [ "$code" = "200" ] && grep -q 'Authentication - GLPI' "$body"; then
              echo "GLPI login page served (HTTP $code, title 'Authentication - GLPI') — pass"
              exit 0
            fi
            echo "[$i] HTTP ${code:-000} — no GLPI login marker yet; retrying in 5 s"
            sleep 5
          done
          echo "GLPI never served its login page (HTTP 200 + 'Authentication - GLPI') in time"
          docker compose logs --tail=200
          exit 1
      - name: Tear down (cleanup)
        if: always()
        run: docker compose down -v

  init-idempotency:
    name: init.sh is idempotent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # No image build needed: bin/init.sh only writes .env (random DB
      # passwords via openssl). Unlike a Laravel APP_KEY, GLPI's encryption
      # key is generated by the app on first boot — not by init.sh.
      - name: First run
        run: ./bin/init.sh
      - name: Snapshot .env
        run: cp .env .env.firstrun
      - name: Second run (must not re-roll the generated DB passwords)
        run: |
          ./bin/init.sh
          if ! diff -u .env.firstrun .env; then
            echo "init.sh is NOT idempotent — random DB passwords were re-rolled"
            exit 1
          fi

  upstream-tests:
    name: GLPI phpunit suite
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.run_upstream_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build + run tester stage (executes upstream phpunit)
        # The tester stage exits non-zero if any GLPI test fails — so
        # the build itself IS the test. No load needed.
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: tester
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=tester
          cache-to: type=gha,scope=tester,mode=max
