; GLPI php-fpm pool overrides
; Loaded after www.conf — keys here override the defaults.

[www]
user = www-data
group = www-data

; Listen on a unix socket inside a shared tmpfs volume between `app` and
; `web`. With TCP listen=0.0.0.0:9000, any sibling container on the glpi
; network could speak FastCGI directly and bypass nginx (SCRIPT_FILENAME
; injection). With a unix socket, only containers that mount the shared
; `fpm-sock` volume can reach php-fpm — that volume scope is the actual
; access-control boundary, not the file mode.
;
; mode 0666 is intentional: nginx:alpine runs as uid `nginx` (!= our
; www-data uid), and unix-socket connect() requires write access. 0660 would
; force a uid/gid sync across both images, fragile across base-image bumps.
listen = /run/php-fpm/glpi.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0666

pm = dynamic
; pm.max_children sized to the default compose app.mem_limit (1.5g). memory_limit
; (512M in php/conf.d/glpi.ini) is the per-request HARD ceiling (OOM-kill guard),
; not the steady state — a GLPI worker realistically uses ~100-150 MiB, so
; 10 * ~150M fits the 1.5g cgroup. Scale pm.max_children AND app.mem_limit
; together for more concurrency.
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /ping
ping.response = pong

; Catch worker stderr in container stdout.
catch_workers_output = yes
decorate_workers_output = no

; clear_env = yes wipes the process environment before each request, so
; secrets meant for OTHER services (DB root password, etc.) can't leak into
; the PHP request context via getenv(). The explicit env[…] forwards below
; give GLPI exactly what it needs.
;
; The GLPI_*_DIR vars are LOAD-BEARING: GLPI reads them to locate its config,
; files, plugins and logs outside the read-only code root. Without them
; (because clear_env wiped the image ENV) GLPI would try to write under
; /var/www/glpi and crash. Always forward them.
clear_env = yes
env[GLPI_CONFIG_DIR] = $GLPI_CONFIG_DIR
env[GLPI_VAR_DIR] = $GLPI_VAR_DIR
env[GLPI_MARKETPLACE_DIR] = $GLPI_MARKETPLACE_DIR
env[GLPI_LOG_DIR] = $GLPI_LOG_DIR
env[GLPI_ENVIRONMENT_TYPE] = $GLPI_ENVIRONMENT_TYPE
env[TZ] = $TZ
; DB coordinates — GLPI primarily reads config_db.php (written at install),
; but forwarding the env keeps the env-driven config path consistent.
env[GLPI_DB_HOST] = $GLPI_DB_HOST
env[GLPI_DB_PORT] = $GLPI_DB_PORT
env[GLPI_DB_NAME] = $GLPI_DB_NAME
env[GLPI_DB_USER] = $GLPI_DB_USER
env[GLPI_DB_PASSWORD] = $GLPI_DB_PASSWORD
; Cache backend (Valkey). The entrypoint wires GLPI's cache config from these;
; forwarding them lets GLPI resolve the same backend at request time.
env[REDIS_HOST] = $REDIS_HOST
env[REDIS_PORT] = $REDIS_PORT
env[REDIS_PASSWORD] = $REDIS_PASSWORD
env[GLPI_CACHE_DSN] = $GLPI_CACHE_DSN
