; GLPI runtime PHP overrides
; Loaded automatically (alphabetical) from /usr/local/etc/php/conf.d/

; --- Resource limits ---
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
; 64M: GLPI stores uploaded documents (asset photos, invoices, inventory
; files) as Documents. The default 2M/8M rejects most real-world uploads —
; this was the exact limit that had to be raised on the live demo before
; attachment import worked. Raise further if your documents are larger.
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 50
; GLPI's configuration and mass-action forms post very large field counts;
; the PHP default of 1000 truncates them silently. Upstream requires >= 5000.
max_input_vars = 5000

; --- Error reporting (production safe) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; --- Sessions ---
session.cookie_httponly = 1
; Flip to 1 when serving over HTTPS (a reverse proxy such as Traefik/Caddy
; terminating TLS in front of the stack). Left 0 so a plain-HTTP local bring-up
; works; set SESSION_COOKIE_SECURE in production.
session.cookie_secure = 0
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; --- Date ---
; PHP ini does NOT expand env vars: date.timezone = ${TZ} would be taken
; literally and PHP would fall back to UTC with a per-request warning. GLPI has
; its own timezone setting (Setup > General) and the OS clock is set from $TZ
; by the container, so a UTC default at the PHP layer is harmless and silent.
date.timezone = UTC

; --- OPcache (production) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps = 0: the code layer is immutable (baked into the image),
; so never stat() files for changes — pure speed. A new image = a fresh cache.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; --- Realpath cache ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Mail ---
sendmail_path = "/usr/sbin/sendmail -t -i"

; --- expose_php off ---
expose_php = Off

; NOTE: disable_functions is intentionally NOT set. GLPI shells out via Symfony
; Process / proc_open (LDAP tooling, PDF generation, marketplace plugin
; installs, the bin/console tasks the scheduler runs). A restrictive
; disable_functions list silently breaks these. Defence-in-depth comes from the
; non-root www-data user, the read-only code layer and container isolation.
